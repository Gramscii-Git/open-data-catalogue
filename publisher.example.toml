schema = 5

[deployment]
harvester = "../harvester"
environment_file = "../harvester/server/.env"
process_environment = {PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"}
python = "../harvester/server/.venv/bin/python"
hf = ["hf"]
build = "build"
readme_template = "README.dataset.md"
viewer_config = "viewer.json"
stop_grace_seconds = 10

[hub]
endpoint = "https://huggingface.co"
repository = "Gramscii-IT/european-open-data-catalogue"
branch = "main"
archive = "open-data-catalogue.tar.gz"
commit_message = "Publish verified Open Data catalogue"
timeout_seconds = "unbounded"

[quality]
document_contract_sha256 = "b5fb27478f63723e0760f08e4a95ce74e2c471469d9eeb52b802d6717e197e7e"
query_languages = ["it", "en"]
minimum_datasets = 23000
maximum_structure_errors = 0
maximum_missing_structures = 0
maximum_missing_licences = 0
maximum_missing_documents = 0
maximum_unscoped_terms = 0
structure_fields = ["active", "served"]
document_fields = ["active", "searchable"]
term_scopes = ["codelist", "conceptscheme"]

[quality.providers.istat]
languages = ["it", "en"]
vocabulary = true
[quality.providers.eurostat]
languages = ["en"]
vocabulary = true
[quality.providers.oecd]
languages = ["en"]
vocabulary = true
[quality.providers.ilo]
languages = ["en"]
vocabulary = true
[quality.providers.dvns]
languages = ["it", "en"]
vocabulary = false
[quality.providers.cruscotto]
languages = ["it"]
vocabulary = false
[quality.providers.milano]
languages = ["it"]
vocabulary = false
[quality.providers.napoli]
languages = ["it"]
vocabulary = false
[quality.providers.roma]
languages = ["it"]
vocabulary = false
[quality.providers.bologna]
languages = ["it"]
vocabulary = false
[quality.providers.torino]
languages = ["it"]
vocabulary = false

[schedule]
label = "it.gramscii.open-data-catalogue"
python = "../harvester/server/.venv/bin/python"
path = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"
log = "build/schedule.log"
action = "release"
interval_seconds = 86400
run_at_load = false
