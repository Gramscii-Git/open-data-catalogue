name: release-contracts

on:
  push:
  pull_request:

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Isolated archive, filesystem, HTTP and CLI contracts
        run: python -m unittest discover -s tests -v
